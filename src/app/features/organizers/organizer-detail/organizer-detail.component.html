<div class="w-full h-full flex flex-col bg-gray-50">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="px-6 lg:px-8 pt-4">
      <a
        routerLink="/organizers"
        class="inline-flex items-center gap-1.5 text-sm font-medium text-gray-500 hover:text-primary-700 transition-colors rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
      >
        <mat-icon class="!w-4 !h-4 !text-base">arrow_back</mat-icon>
        Organisateurs
      </a>
    </div>

    <div *ngIf="organizer" class="px-6 lg:px-8 py-4 flex items-start gap-4 min-w-0">
      <span class="flex h-12 w-12 rounded-xl bg-primary-50 text-primary-700 items-center justify-center text-sm font-bold flex-shrink-0">
        {{ initials(organizer.name) }}
      </span>
      <div class="min-w-0">
        <div class="flex items-center gap-3 flex-wrap">
          <h1 class="text-2xl font-bold text-gray-900 tracking-tight truncate">{{ organizer.name }}</h1>
          <span
            *ngIf="organizer.roleLabel"
            class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold ring-1"
            [ngClass]="roleClasses(organizer.role)"
          >
            <mat-icon class="!w-3.5 !h-3.5 !text-sm">{{ roleIcon(organizer.role) }}</mat-icon>
            {{ organizer.roleLabel }}
          </span>
        </div>
        <p class="text-sm text-gray-500 mt-1 truncate">{{ organizer.email }}</p>
      </div>
    </div>

    <nav *ngIf="organizer" class="px-6 lg:px-8 flex gap-1 overflow-x-auto" aria-label="Sections de l'organisation">
      <button
        *ngFor="let t of tabs"
        type="button"
        (click)="selectTab(t.key)"
        [attr.aria-current]="tab === t.key ? 'page' : null"
        class="inline-flex items-center gap-1.5 px-4 h-11 text-sm font-medium border-b-2 -mb-px whitespace-nowrap transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 rounded-t"
        [ngClass]="tab === t.key ? 'border-primary text-primary-700' : 'border-transparent text-gray-500 hover:text-gray-700'"
      >
        <mat-icon class="!w-4 !h-4 !text-base">{{ t.icon }}</mat-icon>
        {{ t.label }}
      </button>
    </nav>
  </header>

  <div class="flex-1 overflow-y-auto">
    <div *ngIf="isLoading" class="w-full h-full flex items-center justify-center">
      <app-loading></app-loading>
    </div>

    <div *ngIf="!isLoading && error" class="w-full h-full flex items-center justify-center px-6">
      <div class="max-w-sm w-full text-center bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
        <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-danger-50 text-danger-600">
          <mat-icon class="!w-6 !h-6 !text-2xl">error_outline</mat-icon>
        </span>
        <p class="mt-4 text-sm text-gray-700">{{ error }}</p>
        <button
          type="button"
          (click)="load()"
          class="mt-5 inline-flex items-center justify-center gap-2 bg-primary text-white px-5 h-10 rounded-lg font-medium text-sm hover:bg-primary-800 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-2"
        >
          Réessayer
        </button>
      </div>
    </div>

    <div *ngIf="!isLoading && organizer" class="px-6 lg:px-8 py-6">
      <app-organizer-info
        *ngIf="tab === 'info'"
        [organizer]="organizer"
        [canEdit]="canEdit"
        (updated)="onUpdated($event)"
      ></app-organizer-info>

      <app-organizer-stats *ngIf="tab === 'stats'" [organizerId]="organizerId"></app-organizer-stats>

      <app-organizer-events
        *ngIf="tab === 'events'"
        [organizerId]="organizerId"
        [canCreate]="canEdit"
      ></app-organizer-events>

      <app-organizer-members
        *ngIf="tab === 'members'"
        [organizerId]="organizerId"
        [canManage]="canEdit"
        [isOwner]="isOwner"
        [currentUserId]="currentUserId"
        (transferred)="load()"
      ></app-organizer-members>
    </div>
  </div>
</div>
